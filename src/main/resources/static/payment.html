<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body>
<!-- 할인 쿠폰 -->
<div>
    <input type="checkbox" id="coupon-box" />
    <label for="coupon-box"> 5,000원 쿠폰 적용 </label>
</div>
<!-- 결제 UI -->
<div id="payment-method"></div>
<!-- 이용약관 UI -->
<div id="agreement"></div>
<!-- 결제하기 버튼 -->
<button class="button" id="payment-button" style="margin-top: 30px">결제하기</button>

<script>
    main();

    async function main() {
        const button = document.getElementById("payment-button");

        const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
        const tossPayments = TossPayments(clientKey);
        const widgets = tossPayments.widgets({
            customerKey: "BkKHQuJOOde_2zh8_LRT4",
        });

        const price = 1000;
        const quantity = 1;
        const amount = price * quantity;

        await widgets.setAmount({
            currency: "KRW",
            value: amount,
        });

        await Promise.all([
            widgets.renderPaymentMethods({
                selector: "#payment-method",
                variantKey: "DEFAULT",
            }),
            widgets.renderAgreement({
                selector: "#agreement",
                variantKey: "AGREEMENT",
            }),
        ]);

        button.addEventListener("click", async function () {
            try {
                // ✅ 서버로 보낼 요청 (백엔드 DTO 기준)
                const paymentReq = {
                    payType: "EASY_PAY",
                    amount: amount,          // ⭐ 서버 검증용
                    quantity:quantity,
                    orderName: "MONTH",
                    customerEmail: "cherry_kang@naver.com",
                    customerName: "강민서",
                };

                const res = await fetch("/api/payment", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(paymentReq),
                });

                const text = await res.text();
                console.log("raw response:", text);
                if (!text) throw new Error("Empty response body");

                const json = JSON.parse(text);
                if (!res.ok) throw new Error(json.message || "결제 요청 실패");

                const orderId = json?.data?.orderId;
                if (!orderId) throw new Error("orderId가 응답에 없습니다");

                // ✅ Toss 결제창 호출
                await widgets.requestPayment({
                    orderId: orderId,
                    orderName: paymentReq.orderName,
                    successUrl: window.location.origin + "/api/payment/success",
                    failUrl: window.location.origin + "/api/payment/fail",
                    customerEmail: paymentReq.customerEmail,
                    customerName: paymentReq.customerName,
                    customerMobilePhone: "01020090882",
                });

            } catch (e) {
                console.error(e);
                alert("결제 요청 중 오류가 발생했습니다.");
            }
        });
    }
</script>
</body>
</html>
