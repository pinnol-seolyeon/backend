spring:
  application:
    name: pinnol-be
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${SPRING_REDIS_PORT:6379}}
  jackson:
    time-zone: Asia/Seoul

server:
  tomcat:
    keep-alive-timeout: 180s
    max-threads: 200
    max-keep-alive-requests: 100

logging:
  level:
    org.springframework.web: INFO
    org.springframework.web.servlet.DispatcherServlet: WARN
cloud:
  aws:
    s3:
      bucket: finnol-image
    stack:
      auto: false
    region:
      static: ap-northeast-2
    credentials:
      accessKey: ${S3_AWS_ACCESS_KEY_ID}
      secretKey: ${S3_AWS_SECRET_ACCESS_KEY}

myapp:
  fastApi:
    endpoint: ${RAG_URL}

jwt:
  secret: ${JWT_SECRET}

payments:
  toss:
    secret-key: ${PAYMENT_SECRET_KEY}
    success-url: http://localhost:8080/api/payment/success
    fail-url: http://localhost:8080/api/payment/fail
    original-url: https://api.tosspayments.com/v1/payments/confirm
#    client-key: ${PAYMENT_CLIENT_KEY}

slack:
  webhook:
    all: ${SLACK_WEBHOOK_URL}
    error: ${SLACK_WEBHOOK_URL}

custom:
  frontend:
    deploy:
      url: ${OAUTH2_SUCCESS_LOCAL_URL:http://localhost:3000}
